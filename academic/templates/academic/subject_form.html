{% extends "base.html" %}
{% load i18n %}

{% block page_title %}{% if object %}Fanni tahrirlash{% else %}Yangi fan qo'shish{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in-up">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 px-4 pb-0 d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0">
                    <i class="bi {% if object %}bi-pencil-square{% else %}bi-plus-circle-fill{% endif %} me-2 text-primary"></i>
                    {% if object %}{{ object.name }} — Tahrirlash{% else %}Yangi Fan{% endif %}
                </h5>
                <a href="{% url 'subject_list' %}" class="btn btn-outline-secondary btn-sm rounded-3">
                    <i class="bi bi-arrow-left me-1"></i> Orqaga
                </a>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium text-secondary">Fan nomi <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control rounded-3" value="{{ object.name|default:'' }}" required placeholder="masalan: Matematika">
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2 pt-4 border-top mt-4">
                        <a href="{% url 'subject_list' %}" class="btn btn-outline-secondary rounded-3 px-4">Bekor qilish</a>
                        <button type="submit" class="btn btn-primary rounded-3 px-4 shadow-sm">
                            <i class="bi bi-save me-1"></i>
                            Saqlash
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
